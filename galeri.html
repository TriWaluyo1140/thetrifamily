    <main class="page">
    <section id="galeri">
        <div class="wrap">
            <div class="section-head reveal">
                <h2>Galeri Liburan</h2>
                <p>Tempat-tempat yang pernah kami kunjungi bersama. Klik foto untuk melihat lebih besar.</p>
            </div>

            <!--
                CARA MENAMBAH FOTO:
                1. Unggah foto ke folder "galeri" di GitHub (contoh: galeri/foto4.jpg).
                2. Salin satu blok <figure> ... </figure> di bawah, tempel, lalu ganti isinya.
            -->
            <div class="gallery">
                <!-- FOTO 1: ganti nama file, nama tempat, tanggal, dan cerita -->
                <figure class="photo reveal">
                    <img src="galeri/foto1.jpg" alt="Liburan ke Nama Tempat" loading="lazy" onerror="this.parentNode.classList.add('kosong')">
                    <figcaption>
                        <strong>Nama Tempat</strong>
                        <span class="when">📍 Kota · Bulan Tahun</span>
                        <span class="story">Cerita singkat tentang liburan ini.</span>
                    </figcaption>
                </figure>

                <!-- FOTO 2: ganti nama file, nama tempat, tanggal, dan cerita -->
                <figure class="photo reveal">
                    <img src="galeri/foto2.jpg" alt="Liburan ke Nama Tempat" loading="lazy" onerror="this.parentNode.classList.add('kosong')">
                    <figcaption>
                        <strong>Nama Tempat</strong>
                        <span class="when">📍 Kota · Bulan Tahun</span>
                        <span class="story">Cerita singkat tentang liburan ini.</span>
                    </figcaption>
                </figure>

                <!-- FOTO 3: ganti nama file, nama tempat, tanggal, dan cerita -->
                <figure class="photo reveal">
                    <img src="galeri/foto3.jpg" alt="Liburan ke Nama Tempat" loading="lazy" onerror="this.parentNode.classList.add('kosong')">
                    <figcaption>
                        <strong>Nama Tempat</strong>
                        <span class="when">📍 Kota · Bulan Tahun</span>
                        <span class="story">Cerita singkat tentang liburan ini.</span>
                    </figcaption>
                </figure>

            </div>
        </div>
    </section>

    <!-- Tampilan foto besar (lightbox) -->
    <div class="lightbox" id="lightbox" hidden>
        <button class="lb-close" aria-label="Tutup">✕</button>
        <button class="lb-prev" aria-label="Foto sebelumnya">‹</button>
        <figure>
            <img src="" alt="">
            <figcaption></figcaption>
        </figure>
        <button class="lb-next" aria-label="Foto berikutnya">›</button>
    </div>
    </main>

    <footer>
        <div class="wrap">
