<html lang="id">

<title>Keluarga Besar Waluyo</title>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family: Arial, sans-serif;
    line-height:1.6;
    color:#333;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:15px 40px;
    position:sticky;
    top:0;
    z-index:1000;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu{
    display:flex;
    list-style:none;
    gap:20px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:8px 12px;
    border-radius:5px;
    transition:0.3s;
}

.menu a:hover{
    background:rgba(255,255,255,0.2);
}

.hero{
    height:90vh;
    background-image:url('https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1600');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content{
    background:rgba(0,0,0,0.5);
    color:white;
    padding:40px;
    border-radius:15px;
}

.hero h1{
    font-size:48px;
}

.hero p{
    margin-top:10px;
    font-size:20px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    border-radius:30px;
    background:#FFD54F;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

.btn:hover{
    background:#FFC107;
}

section{
    padding:80px 10%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
    color:#0d47a1;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.family-tree{
    background:#f5f5f5;
    border-radius:10px;
    padding:25px;
    text-align:center;
}

.family-tree ul{
    list-style:none;
}
